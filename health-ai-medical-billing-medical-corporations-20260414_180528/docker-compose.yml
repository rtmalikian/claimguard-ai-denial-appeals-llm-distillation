name: health-ai-medical-billing-medical-corporations-20260414_180528

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: claimguard
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: claimguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DOCKER_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${DOCKER_API_PORT:-8001}:8000"
    environment:
      DATABASE_URL: postgresql://claimguard:secure_password@db:5432/claimguard
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production-min-32-chars}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-ClaimGuard Admin}
      BOOTSTRAP_ADMIN_SYNC_FROM_ENV: ${BOOTSTRAP_ADMIN_SYNC_FROM_ENV:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LLM_PROVIDER: ${LLM_PROVIDER:-nvidia_nim}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/llama-3.3-nemotron-super-49b-v1.5}
      NVIDIA_OCR_MODEL: ${NVIDIA_OCR_MODEL:-nvidia/nemotron-parse}
      NVIDIA_TIMEOUT: ${NVIDIA_TIMEOUT:-120}
      MLX_BASE_URL: ${MLX_BASE_URL:-http://host.docker.internal:8080/v1}
      MLX_MODEL: ${MLX_MODEL:-Qwen/Qwen3-4B-MLX-4bit}
      MLX_FALLBACK_MODEL: ${MLX_FALLBACK_MODEL:-Qwen/Qwen3-1.7B}
      MLX_TIMEOUT: ${MLX_TIMEOUT:-120}
      OCR_ENGINE: ${OCR_ENGINE:-nvidia_nemotron_parse}
      OCR_TIMEOUT: 120
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app

  frontend:
    working_dir: /app
    command: npm run dev
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "${DOCKER_FRONTEND_PORT:-5173}:5173"
    environment:
      - DOCKER=1
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/package.json:/app/package.json
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/index.html:/app/index.html
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - api

volumes:
  postgres_data:
